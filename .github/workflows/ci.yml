name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, unit, integration and e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: demos
          POSTGRES_PASSWORD: demos
          POSTGRES_DB: demos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - run: yarn typecheck

      - run: yarn lint

      - run: yarn format:check

      - run: yarn test:unit

      - run: yarn test:integration
        env:
          TEST_DATABASE_URL: postgres://demos:demos@localhost:5432/demos_test

      - name: E2E database
        run: psql postgres://demos:demos@localhost:5432/demos_test -c 'CREATE DATABASE demos_e2e'

      - run: yarn playwright install --with-deps chromium

      - run: yarn test:e2e
        env:
          E2E_DATABASE_URL: postgres://demos:demos@localhost:5432/demos_e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI — ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ci-probe — демо, только что развернутое из шаблона: так проверяется сама команда; остальные — демо со своими страницами
        app: [ci-probe, dental, auto]
    # страницы демо читают CMS: базу создают миграции при старте, контент — засев демо в пустую базу
    env:
      DATABASE_URL: postgres://demos:demos@localhost:5432/demos_lighthouse
      PAYLOAD_SECRET: lighthouse
      MIGRATE_ON_START: 'true'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: demos
          POSTGRES_PASSWORD: demos
          POSTGRES_DB: demos_lighthouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - name: Runner CPUs
        run: nproc

      - if: matrix.app == 'ci-probe'
        run: yarn demo:new ci-probe

      - run: yarn test:lighthouse ${{ matrix.app }}

      - name: CPU class and score of each run
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("node:fs");
            for (const file of fs.readdirSync(".lighthouseci").filter((name) => /^lhr-.*\.json$/.test(name))) {
              const lhr = JSON.parse(fs.readFileSync(`.lighthouseci/${file}`, "utf8"));
              const tbt = Math.round(lhr.audits["total-blocking-time"].numericValue);
              console.log(lhr.finalDisplayedUrl, "benchmarkIndex", lhr.environment.benchmarkIndex, "performance", lhr.categories.performance.score, "TBT", tbt);
            }
          '

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report-${{ matrix.app }}
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7

  # по образу на каждое демо из apps/ (D41); выкатываются только демо со стендом — slug в переменной COOLIFY_APPS
  apps:
    name: Demo list
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4

      - id: list
        run: echo "apps=$(ls apps | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  image:
    name: Image and deploy — ${{ matrix.app }}
    needs: [checks, apps]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.apps) }}
    env:
      IMAGE: ghcr.io/nikolaymurashkin/mrshkn-demo-${{ matrix.app }}:${{ github.sha }}
      APP_UUID: ${{ fromJSON(vars.COOLIFY_APPS || '{}')[matrix.app] }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: APP=${{ matrix.app }}
          cache-from: type=gha,scope=demo-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=demo-${{ matrix.app }}

      - name: Deploy to Coolify
        if: env.APP_UUID != ''
        env:
          COOLIFY_URL: https://coolify.mrshkn.com/api/v1
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          api() { curl -sS --fail-with-body -H "Authorization: Bearer $COOLIFY_TOKEN" -H 'Content-Type: application/json' "$@"; }
          api -X PATCH "$COOLIFY_URL/applications/$APP_UUID" -d "{\"docker_registry_image_tag\":\"$GITHUB_SHA\"}" > /dev/null
          deployment=$(api -X POST "$COOLIFY_URL/deploy?uuid=$APP_UUID" | jq -r '.deployments[0].deployment_uuid')
          echo "deployment $deployment"
          for _ in $(seq 60); do
            status=$(api "$COOLIFY_URL/deployments/$deployment" | jq -r .status)
            case $status in
              finished) exit 0 ;;
              failed | cancelled*) echo "status: $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "status after 10 min: $status"
          exit 1
